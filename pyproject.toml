[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verknode-printing3d"
version = "0.1.1"
description = "3D printing for verknode: meshes and CAD files, modelling, a slicer, G-code, 3D viewers and editors"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shinichiro Wachi" }]
keywords = ["verknode", "3d-printing", "stl", "gcode", "cad", "slicer"]
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "trimesh>=4.4",
    "shapely>=2.0",          # sections and the slicer's outlines
    "rtree>=1.0",            # sections of larger meshes (trimesh)
    "scipy>=1.10",           # trimesh: geometry (convex hulls, proximity)
    "networkx>=3.0",         # trimesh: graphs (bodies, watertight checks)
    "lxml>=4.9",             # trimesh: 3MF files
    "manifold3d>=2.4",       # booleans
    "mapbox-earcut>=1.0",    # extrusions
    "ezdxf>=1.1",            # DXF drawings
    "cascadio>=0.0.13",      # STEP / IGES / BREP (OpenCascade)
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/verknode-project/verknode-printing3d"
verknode = "https://github.com/verknode-project/verknode"

# verknode finds the package by this entry point (docs/packages.md in verknode)
[project.entry-points."verknode.packages"]
printing3d = "verknode_printing3d:package"

# the versions of verknode's node API it works with (the same as API in verknode_printing3d/__init__.py)
[tool.verknode]
api = ">=1.1,<2"

[tool.hatch.build.targets.wheel]
packages = ["src/verknode_printing3d"]
